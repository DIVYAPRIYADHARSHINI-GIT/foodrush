<!doctype html>
<html lang="en" class="h-full">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta
			name="description"
			content="FoodRush - hungry? Order in minutes. Browse neighbourhood restaurants, filter veg and non-veg, build a cart, apply coupons, track your order live and rate the food. A browser-only demo food ordering app."
		/>
		<meta name="theme-color" content="#f5820b" />
		<script>
			// Apply the saved theme before first paint so there is no light/dark flash.
			// FoodRush is light-FIRST: food photography reads best on cream paper, so with no
			// preference saved we follow the system and default to light.
			try {
				const theme = localStorage.getItem('foodrush:theme') || 'system';
				const dark =
					theme === 'dark' ||
					(theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
				if (dark) document.documentElement.classList.add('dark');
			} catch (e) {
				// Storage blocked (private mode / embedded webview) - fall back to light.
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="h-full">
		<div style="display: contents" class="h-full">%sveltekit.body%</div>
	</body>
</html>
